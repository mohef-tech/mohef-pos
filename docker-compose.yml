services:
  postgres:
    image: postgres:17-alpine
    container_name: mohef-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mohef_pos_db
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: pos1606
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_admin -d mohef_pos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
